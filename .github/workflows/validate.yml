name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: generated output must not drift from the generator
        run: git diff --exit-code -- plugins .claude-plugin .github/plugin
      - run: npm run validate
      - run: npm test
